<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Certificate placeholder">
  <rect x="0" y="0" width="400" height="300" fill="#f0ece5"/>
  <rect x="14" y="14" width="372" height="272" fill="none" stroke="#999" stroke-width="1.25" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- corner brackets -->
  <g stroke="#333" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M28 50 V28 H50"/>
    <path d="M350 28 H372 V50"/>
    <path d="M372 250 V272 H350"/>
    <path d="M50 272 H28 V250"/>
  </g>

  <!-- seal / ribbon icon, single consistent stroke weight -->
  <g transform="translate(200,128)" stroke="#333" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <circle r="30"/>
    <circle r="21"/>
    <path d="M-12 24 L-18 58 L0 46 L18 58 L12 24"/>
  </g>

  <text x="200" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#333" opacity="0.75">Certificate image</text>
  <text x="200" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#999">REPLACE THIS FILE</text>
</svg>
